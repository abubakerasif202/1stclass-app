name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run targeted safety tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "au.com.firstclassexpress.driver.domain.rules.JobTransitionRulesTest" \
            --tests "au.com.firstclassexpress.driver.domain.rules.InspectionRulesTest" \
            --tests "au.com.firstclassexpress.driver.domain.rules.ShiftRulesTest" \
            --tests "au.com.firstclassexpress.driver.domain.rules.EvidenceRulesTest" \
            --tests "au.com.firstclassexpress.driver.viewmodel.ShiftViewModelTest" \
            --tests "au.com.firstclassexpress.driver.viewmodel.JobViewModelTest" \
            --tests "au.com.firstclassexpress.driver.viewmodel.EvidenceViewModelTest" \
            --stacktrace

      - name: Verify unsafe generated patterns are gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'MockData|updateJobStatus|fun startShift|mutableStateOf<String\?>\("PASS"\)|hasPhoto = true|hasSignature = true|JobStatus\.UNASSIGNED, JobStatus\.ASSIGNED' app/src/main/java; then
            echo "Unsafe legacy driver workflow pattern found"
            exit 1
          fi
          if grep -n 'debugConfig' app/build.gradle.kts; then
            echo "Custom debug signing configuration still exists"
            exit 1
          fi
          if grep -RInE 'firebase\.ai|firebase-ai|GEMINI_API_KEY' . --exclude-dir=.git --exclude-dir=docs --exclude-dir=.github; then
            echo "Unused AI/Firebase generation scaffold still exists"
            exit 1
          fi
          echo "Phase 1 unsafe-pattern scan clean"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # CI only ever built debug, so a configuration-cache break in the release task graph went
      # unnoticed and left `assembleRelease`/`bundleRelease` unbuildable. --dry-run configures the
      # release tasks and stores the configuration cache without executing them, so this catches
      # the same class of failure without needing any signing secrets in CI.
      - name: Validate release task configuration
        run: gradle :app:assembleRelease :app:bundleRelease --dry-run --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
